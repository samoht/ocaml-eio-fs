name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# hermetic is pinned from its repository until it is on opam.
env:
  HERMETIC_PIN: https://github.com/samoht/ocaml-hermetic.git

jobs:
  build:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.3', '5.4', '5.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Eio_main falls back from eio_linux to eio_posix when io_uring is
    # refused. Naming the backend makes the Linux jobs run eio_linux or fail.
    env:
      EIO_BACKEND: ${{ matrix.os == 'ubuntu-latest' && 'linux' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam pin add -n hermetic "$HERMETIC_PIN"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  release:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam pin add -n hermetic "$HERMETIC_PIN"
      - run: opam install . --deps-only
      - run: opam exec -- dune build -p eio-fs @install

  lower-bounds:
    name: Lower bounds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EIO_BACKEND: linux
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'

      # Resolve every dependency to the oldest version its lower bound allows,
      # so a call that only compiles against a newer API fails here rather than
      # in a downstream opam build.
      - run: opam pin add -n hermetic "$HERMETIC_PIN"
      - run: opam install . --deps-only --with-test --criteria="+count[version-lag,solution]"
      - run: opam exec -- dune build
      - run: opam exec -- dune test

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam pin add -n hermetic "$HERMETIC_PIN"
      - run: opam install . --deps-only --with-doc
      - run: opam install odoc
      - run: opam exec -- dune build @doc

  lint-fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - uses: ocaml/setup-ocaml/lint-fmt@v3

  # merlint is not on opam yet and its dependencies come from a private
  # overlay, so this job reports without blocking until merlint is released.
  merlint:
    name: Lint (merlint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.4'

      - run: opam repo add samoht https://tangled.org/gazagnaire.org/opam-overlay.git
      - run: opam pin add -n hermetic "$HERMETIC_PIN"
      - run: opam install . --deps-only --with-test
      - run: opam install merlint
      - run: opam exec -- merlint --build
